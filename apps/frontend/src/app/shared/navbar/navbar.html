<nav class="navbar panel-vidrio">
  <div class="nav-brand">
    <a routerLink="/" class="logo">Metrics AI</a>
  </div>
  <div class="nav-links">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">Inicio</a>
    <a routerLink="/sobre-nosotros" routerLinkActive="active" class="nav-link">Sobre nosotros</a>
    <a routerLink="/servicios" routerLinkActive="active" class="nav-link">Servicios</a>
    <a routerLink="/novedades" routerLinkActive="active" class="nav-link">Novedades</a>
    <a routerLink="/lead-magnet" routerLinkActive="active" class="nav-link nav-cta">Simulador de precios</a>
    <a routerLink="/contacto" routerLinkActive="active" class="nav-link">Contacto</a>
  </div>
  <div class="nav-auth">
    @if (autenticado()) {
      <span class="nav-saludo">Hola, {{ usuarioActual()?.nombre }}</span>
      <button type="button" (click)="cerrarSesion()" class="nav-auth-link">Salir</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active" class="nav-auth-link">Ingresar</a>
      <a routerLink="/registrar" routerLinkActive="active" class="nav-auth-link">Crear cuenta</a>
    }
  </div>
</nav>
