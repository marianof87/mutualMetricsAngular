openapi: 3.0.3
info:
  title: MutualMetrics API
  description: |
    API REST del proyecto MutualMetrics (NestJS).
    Organizada en 5 slices verticales. Cada slice lo posee un integrante
    distinto (ver GUIA.md §1).
    Todas las respuestas de error siguen el esquema `ErrorEnvelope`.
  version: 0.3.0
servers:
  - url: /api/v1

tags:
  - name: auth
    description: Slice 1 — Auth & Usuarios (@Nubiru)
  - name: usuarios
    description: Slice 1 — Auth & Usuarios (@Nubiru)
  - name: cuadratica
    description: Slice 2 — Calculadora Cuadrática (@marianof87)
  - name: pricing
    description: Slice 3 — Optimizador de Precios (@Monzon1983)
  - name: escenarios
    description: Slice 4 — Historial & Escenarios (@Franco1212)
  - name: novedades
    description: Slice 5 — Contenido Público (@Ange1809)
  - name: contacto
    description: Slice 5 — Contacto (@Ange1809)
  - name: finanzas
    description: Extra — Calculadora Financiera (interés simple/compuesto, ROI, VAN, TIR)

paths:
  # ================ Slice 1 — Auth & Usuarios ================
  /auth/registrar:
    post:
      tags: [auth]
      summary: Registra un usuario nuevo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrarRequest" }
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SesionResponse" }
        "409":
          description: Email ya registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /auth/login:
    post:
      tags: [auth]
      summary: Autentica un usuario existente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SesionResponse" }
        "401":
          description: Credenciales inválidas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /usuarios/yo:
    get:
      tags: [usuarios]
      summary: Datos del usuario autenticado
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }
    patch:
      tags: [usuarios]
      summary: Actualiza el perfil del usuario autenticado
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsuarioActualizar" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }

  # ================ Slice 2 — Cuadrática ================
  /cuadratica/resolver:
    post:
      tags: [cuadratica]
      summary: Resuelve ax² + bx + c = 0
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CuadraticaRequest" }
      responses:
        "200":
          description: Resultados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CuadraticaResponse" }
        "422":
          description: a = 0 u otra validación fallida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  # ================ Slice 3 — Pricing ================
  /pricing/optimizar:
    post:
      tags: [pricing]
      summary: Calcula precio óptimo de revenue y profit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PricingRequest" }
      responses:
        "200":
          description: Resultado con curvas y óptimos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricingResponse" }

  # ================ Slice 4 — Escenarios ================
  /escenarios:
    get:
      tags: [escenarios]
      summary: Lista los escenarios del usuario autenticado (paginado)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/TamanoPagina"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Paginado" }
    post:
      tags: [escenarios]
      summary: Guarda un escenario (cuadrática o pricing)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EscenarioCreate" }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Escenario" }

  /escenarios/{id}:
    get:
      tags: [escenarios]
      summary: Detalle de un escenario
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Escenario" }
    delete:
      tags: [escenarios]
      summary: Borra un escenario
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Borrado

  # ================ Slice 5 — Novedades ================
  /novedades:
    get:
      summary: Lista todas las novedades
      tags: [novedades]
      parameters:
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/TamanoPagina"
      responses:
        '200':
          description: Lista paginada de novedades
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginado"
                  - properties:
                      datos:
                        type: array
                        items:
                          $ref: "#/components/schemas/NovedadResponse"
    post:
      summary: Crea una nueva novedad
      tags: [novedades]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrearNovedadRequest" }
      responses:
        '201':
          description: Novedad creada exitosamente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NovedadResponse" }

  # ================ Slice 5 — Contacto ================
  /contactos:
    post:
      tags: [contacto]
      summary: Registra un mensaje de contacto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactoRequest" }
            examples:
              valido:
                value:
                  nombre: "Juan Pérez"
                  email: "juan@example.com"
                  mensaje: "Quisiera más información sobre el sistema."
      responses:
        "201":
          description: Mensaje recibido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactoResponse" }
        "422":
          description: Error de validación
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  # ================ Extra — Calculadora Financiera ================
  /finanzas/interes-simple:
    post:
      tags: [finanzas]
      summary: Calcula el interés simple y el monto total
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InteresSimpleRequest" }
      responses:
        "201":
          description: Interés simple calculado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InteresSimpleResponse" }
        "422":
          description: Error de validación
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /finanzas/interes-compuesto:
    post:
      tags: [finanzas]
      summary: Calcula el interés compuesto y el monto total
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InteresCompuestoRequest" }
      responses:
        "201":
          description: Interés compuesto calculado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InteresCompuestoResponse" }
        "422":
          description: Error de validación
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /finanzas/roi:
    post:
      tags: [finanzas]
      summary: Calcula el retorno sobre la inversión (ROI)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ROIRequest" }
      responses:
        "201":
          description: ROI calculado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ROIResponse" }
        "422":
          description: Error de validación
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /finanzas/van:
    post:
      tags: [finanzas]
      summary: Calcula el Valor Actual Neto (VAN/NPV)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VANRequest" }
      responses:
        "201":
          description: VAN calculado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VANResponse" }
        "422":
          description: Error de validación
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /finanzas/tir:
    post:
      tags: [finanzas]
      summary: Calcula la Tasa Interna de Retorno (TIR/IRR)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TIRRequest" }
      responses:
        "201":
          description: TIR calculada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TIRResponse" }
        "422":
          description: Error de validación
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegistrarRequest:
      type: object
      required: [email, password, nombre]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        nombre: { type: string, minLength: 1, maxLength: 100 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    SesionResponse:
      type: object
      required: [accessToken, usuario]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        usuario: { $ref: "#/components/schemas/Usuario" }

    Usuario:
      type: object
      required: [id, email, nombre]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        nombre: { type: string }

    UsuarioActualizar:
      type: object
      required: [nombre]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 100 }

    CuadraticaRequest:
      type: object
      required: [a, b, c]
      properties:
        a: { type: number }
        b: { type: number }
        c: { type: number }

    CuadraticaResponse:
      type: object
      required: [discriminante, vertice]
      properties:
        discriminante: { type: number }
        raices:
          oneOf:
            - type: 'null'
            - type: array
              items: { type: number }
              minItems: 2
              maxItems: 2
        vertice:
          type: object
          required: [x, y]
          properties:
            x: { type: number }
            y: { type: number }

    PricingRequest:
      type: object
      required: [precioActual, unidadesVendidas, sensibilidadDemanda, costoVariable]
      properties:
        precioActual: { type: number }
        unidadesVendidas: { type: number }
        sensibilidadDemanda: { type: number }
        costoVariable: { type: number }
        costosFijos: { type: number, default: 0 }

    PricingResponse:
      type: object
      required: [optimoRevenue, optimoProfit]
      properties:
        optimoRevenue:
          type: object
          properties:
            precio: { type: number }
            valor: { type: number }
        optimoProfit:
          type: object
          properties:
            precio: { type: number }
            valor: { type: number }
        breakEven:
          type: array
          items: { type: number }

    Escenario:
      type: object
      required: [id, tipo, inputs, outputs, creadoEn]
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string, enum: [cuadratica, pricing] }
        inputs: {}
        outputs: {}
        creadoEn: { type: string, format: date-time }

    EscenarioCreate:
      type: object
      required: [tipo, inputs, outputs]
      properties:
        tipo: { type: string, enum: [cuadratica, pricing] }
        inputs: {}
        outputs: {}

    ContactoRequest:
      type: object
      required: [nombre, email, mensaje]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
        mensaje: { type: string, minLength: 10, maxLength: 2000 }

    ContactoResponse:
      type: object
      required: [id, recibidoEn]
      properties:
        id: { type: string, format: uuid }
        recibidoEn: { type: string, format: date-time }

    InteresSimpleRequest:
      type: object
      required: [principal, tasa, tiempo]
      properties:
        principal: { type: number, minimum: 0, description: Capital inicial }
        tasa: { type: number, minimum: 0, description: Tasa de interés (por período) }
        tiempo: { type: number, minimum: 0, description: Cantidad de períodos }

    InteresSimpleResponse:
      type: object
      required: [interes, total]
      properties:
        interes: { type: number }
        total: { type: number }

    InteresCompuestoRequest:
      type: object
      required: [principal, tasa, tiempo]
      properties:
        principal: { type: number, minimum: 0 }
        tasa: { type: number, minimum: 0 }
        tiempo: { type: number, minimum: 0 }
        frecuencia:
          type: number
          minimum: 1
          default: 1
          description: Capitalizaciones por período (1 = anual)

    InteresCompuestoResponse:
      type: object
      required: [interes, total]
      properties:
        interes: { type: number }
        total: { type: number }

    ROIRequest:
      type: object
      required: [inversion, beneficio]
      properties:
        inversion: { type: number, minimum: 1, description: Monto invertido (mayor a 0) }
        beneficio: { type: number, description: Beneficio obtenido }

    ROIResponse:
      type: object
      required: [roi]
      properties:
        roi: { type: number, description: Retorno sobre la inversión (proporción) }

    VANRequest:
      type: object
      required: [tasa, inversionInicial, flujos]
      properties:
        tasa: { type: number, minimum: 0, description: Tasa de descuento }
        inversionInicial: { type: number, description: Usualmente negativo }
        flujos:
          type: array
          items: { type: number }
          description: Flujos de fondos por período

    VANResponse:
      type: object
      required: [van]
      properties:
        van: { type: number, description: Valor Actual Neto }

    TIRRequest:
      type: object
      required: [inversionInicial, flujos]
      properties:
        inversionInicial: { type: number }
        flujos:
          type: array
          items: { type: number }

    TIRResponse:
      type: object
      required: [tir]
      properties:
        tir: { type: number, description: Tasa Interna de Retorno }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                Código de error estable en UPPER_SNAKE_CASE.
                Ver docs/CODIGOS_ERROR.md para el catálogo completo.
            message: { type: string }
            details: {}
            traceId: { type: string }

    Paginado:
      type: object
      required: [datos, total, pagina, tamano]
      properties:
        datos:
          type: array
          items: {}
        total: { type: integer, minimum: 0 }
        pagina: { type: integer, minimum: 1 }
        tamano: { type: integer, minimum: 1, maximum: 100 }

  parameters:
    Pagina:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    TamanoPagina:
      name: tamano
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
