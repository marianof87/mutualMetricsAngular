# docker-compose para MutualMetrics.
# Funciona con `docker compose up` y también con `podman compose up`.
#
# `pull_policy: never` evita que podman intente bajar el tag
# `mutual-metrics-*` desde docker.io cuando corre el contenedor.

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: mutual-metrics-backend
    pull_policy: never
    container_name: mutual-metrics-backend
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CORS_ORIGIN=http://localhost:8080,http://localhost:4200
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: mutual-metrics-frontend
    pull_policy: never
    container_name: mutual-metrics-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
