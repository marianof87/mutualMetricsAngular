server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Proxy del API: el frontend llama rutas mismo-origen `/api/v1/*` y nginx las
  # reenvía al contenedor backend. Así el bundle no hardcodea ninguna URL.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback: cualquier ruta no encontrada devuelve index.html
  # para que el router del cliente maneje la navegación.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache agresivo para assets con hash en el nombre.
  location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|webp|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
